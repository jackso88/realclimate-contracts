[project]
name = "realclimate-contracts"
version = "0.1.0"
description = "Shared message contracts for the realclimate services"
authors = [{ name = "RealClimate" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic>=2.12.0,<3.0.0",
]

[tool.poetry]
packages = [{ include = "realclimate_contracts", from = "src" }]

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.coverage.run]
source = ["realclimate_contracts"]

[tool.coverage.report]
show_missing = true
skip_covered = true
